<!DOCTYPE html>
<html lang="fi"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Elisa Perheliittymä-agentti — Neuvottele perhepakettisi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:48px;max-width:420px;width:90%;text-align:center}
.icon{font-size:48px;margin-bottom:16px}
.title{font-size:22px;font-weight:700;color:#334155;margin-bottom:8px}
.sub{font-size:14px;color:#94a3b8;margin-bottom:32px}
.field{position:relative;margin-bottom:16px}
input{width:100%;padding:14px 48px 14px 16px;border:2px solid #e2e8f0;border-radius:12px;font-size:16px;outline:none;transition:border-color .2s}
input:focus{border-color:#6366f1}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#94a3b8;font-size:18px;padding:4px}
.go{width:100%;padding:14px;background:#6366f1;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s}
.go:hover{background:#4f46e5}.go:disabled{background:#94a3b8;cursor:not-allowed}
.err{color:#dc2626;font-size:13px;margin-top:12px;display:none}
.spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s .6s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head><body>
<div class="box">
  <div class="icon">🔐</div>
  <div class="title">Suojattu sisältö</div>
  <div class="sub">Anna salasana avataksesi sovelluksen</div>
  <form id="f">
    <div class="field">
      <input type="password" id="pw" placeholder="Salasana" autocomplete="off" autofocus>
      <button type="button" class="eye" id="eye">👁</button>
    </div>
    <button type="submit" class="go" id="go">Avaa</button>
  </form>
  <div class="err" id="err">Väärä salasana.</div>
</div>

  go.innerHTML='<span class="spin"></span>Puretaan...';
  var t=new TextEncoder();
  crypto.subtle.importKey("raw",t.encode(p),"PBKDF2",false,["deriveKey"])
