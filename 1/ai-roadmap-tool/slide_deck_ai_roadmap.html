<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Suojattu sisältö</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0B1F3A;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.gate{background:#fff;color:#111827;border-radius:16px;padding:40px;width:90%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lock{width:56px;height:56px;border-radius:14px;background:#2750E6;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.lock svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2}
h1{font-size:19px;font-weight:700;text-align:center;margin-bottom:6px}
p.sub{font-size:13px;color:#6B7280;text-align:center;margin-bottom:24px}
input{width:100%;padding:13px 14px;border:1px solid #D1D5DB;border-radius:9px;font-size:15px;margin-bottom:12px}
input:focus{outline:none;border-color:#2750E6;box-shadow:0 0 0 3px rgba(39,80,230,.14)}
button{width:100%;padding:13px;border:none;border-radius:9px;background:#2750E6;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:hover{background:#1E40CC}
button:disabled{opacity:.6;cursor:wait}
.err{color:#DC2626;font-size:13px;text-align:center;margin-top:12px;min-height:18px}
.foot{font-size:11px;color:#9CA3AF;text-align:center;margin-top:20px}
</style>
</head>
<body>
<div class="gate">
  <div class="lock"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
  <h1>Suojattu sisältö</h1>
  <p class="sub">Tämä aineisto on salattu. Syötä salasana avataksesi.</p>
  <form id="f">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Salasana" autofocus>
    <button id="btn" type="submit">Avaa</button>
  </form>
  <div class="err" id="err"></div>
  <div class="foot">PBKDF2-SHA256 · AES-GCM-256</div>
</div>

const ITER = 600000;
const STORAGE_KEY = "fondia:auth-v1:1";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(password, salt){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
}
async function tryDecrypt(password){
  const salt = b64(DATA.salt), iv = b64(DATA.iv), ct = b64(DATA.ct);
  const key = await deriveKey(password, salt);
  const buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct);
  return new TextDecoder().decode(buf);
}
function render(html){ document.open(); document.write(html); document.close(); }
async function unlock(password, persist){
  const html = await tryDecrypt(password);
  if(persist){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({ pw:password, exp:Date.now()+86400000 })); }catch(e){} }
  render(html);
}
(async () => {
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const o = JSON.parse(raw); if(o && o.exp > Date.now() && o.pw){ await unlock(o.pw, false); return; } localStorage.removeItem(STORAGE_KEY); }
  }catch(e){}
})();
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  const pw = document.getElementById('pw').value;
  err.textContent=''; btn.disabled=true; btn.textContent='Avataan…';
  try{ await unlock(pw, true); }
  catch(ex){ err.textContent='Väärä salasana.'; btn.disabled=false; btn.textContent='Avaa'; try{if(window.mypa&&window.mypa.send)window.mypa.send('login_fail');}catch(e){} }
});

 *
 * Self-tagging (oman vierailusi erottelu):
 *   Käy kerran sivulla URL:lla ?_mypa_self=1 → localStorageen tallentuu lippu,
 *   ja kaikki tulevat eventit lähetetään {self:true}. Pois: ?_mypa_self=0.

(function () {
  if (typeof window === "undefined") return;
  if (window.mypa && window.mypa.__initialized) return;

  var SITE = window.__MYPA_SITE__ || "unknown";
  var ENDPOINT = window.__MYPA_ENDPOINT__ || "";
  var AUTO_EVENT = window.__MYPA_AUTO_EVENT__ || "pageview";

  if (!ENDPOINT) return;

  // Self-marker: URL-parametri tai localStorage-lippu.
  var SELF = false;
  try {
    var sp = new URLSearchParams(window.location.search);
    if (sp.get("_mypa_self") === "1") {
      try { localStorage.setItem("mypa_self", "1"); } catch (e) {}
    } else if (sp.get("_mypa_self") === "0") {
      try { localStorage.removeItem("mypa_self"); } catch (e) {}

    try { SELF = localStorage.getItem("mypa_self") === "1"; } catch (e) {}
  } catch (e) {}

    try {
      var p = new URLSearchParams(window.location.search);
      return {
        source: p.get("utm_source") || null,
        medium: p.get("utm_medium") || null,
        campaign: p.get("utm_campaign") || null,

      return { source: null, medium: null, campaign: null };

    var ctx = {};
    try {
      ctx.screen_w = window.screen && screen.width || null;
      ctx.screen_h = window.screen && screen.height || null;
      ctx.viewport_w = window.innerWidth || null;
      ctx.viewport_h = window.innerHeight || null;
      ctx.dpr = window.devicePixelRatio || null;
      ctx.language = (navigator.language || "").slice(0, 16);

    try {

        path: window.location.pathname + window.location.search,

        method: "POST",
        headers: { "content-type": "text/plain;charset=UTF-8" },

        keepalive: true,
        mode: "cors",
        credentials: "omit",
